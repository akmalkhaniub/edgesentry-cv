[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edgesentry"
version = "2.0.0"
description = "Robot-cell safety agent: OpenCV 5 perception, Amazon Bedrock decisions with code guardrails, AWS Lambda delivery"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.4", "opencv-python-headless==5.0.0.93"]

[project.optional-dependencies]
aws = ["boto3==1.43.118"]
dev = ["pytest==9.0.3", "coverage==7.16.1", "boto3==1.43.118"]

[project.scripts]
edgesentry = "edgesentry.cli:main"

[tool.setuptools]
packages = ["edgesentry"]

[tool.setuptools.package-data]
edgesentry = ["web/*.html"]
