services:
  edgesentry-cv:
    build:
      context: .
      dockerfile: Dockerfile
    image: edgesentry-cv:latest
    container_name: edgesentry-cv
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=production
      - PORT=3005
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
